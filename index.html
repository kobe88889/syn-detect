<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Syn-Detect Live</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>html,body,#chart{height:100%;margin:0}</style>
</head>
<body>
<div id="chart"></div>
<script>
const chart = echarts.init(document.getElementById('chart'));
const option = {
  title: { text: '实时 SYN 流量 (bits/s)' },
  xAxis: { type: 'category', data: [] },
  yAxis: { type: 'value' },
  series: [{ type: 'line', data: [], smooth: true }]
};
chart.setOption(option);

const ws = new WebSocket('ws://127.0.0.1:8083');
ws.onmessage = evt => {
  const json = JSON.parse(evt.data);
  const bps = json.bps;
  const entropy = json.entropy;
  const alert = json.alert;
  const now = new Date().toLocaleTimeString();

  option.xAxis.data.push(now);
  option.series[0].data.push(bps);

  // 红点：只要 alert=true 就画 markPoint
  if (alert) {
    option.series[0].markPoint = {
      data: [{ coord: [now, bps], name: '熵>7', itemStyle: { color: 'red' } }]
    };
  } else {
    option.series[0].markPoint = null;   // 清除上一红点
  }

  if (option.xAxis.data.length > 20) {
    option.xAxis.data.shift();
    option.series[0].data.shift();
  }
  chart.setOption(option);
};
</script>
</body>
</html>
